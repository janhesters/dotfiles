# Sony ZV-E1 camera USB audio must never win default-mic selection:
# real mics (Scarlett 2i2 ~2100, built-in ~2009) rank above its demoted 100.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*ZV-E1.*" }
    ]
    actions = {
      update-props = {
        priority.session = 100
        priority.driver = 100
      }
    }
  }
]
